<style>
  			/* Sidebar */
			.sidenav {
			position: fixed;
			left: 50px;
			top: 80px;
			bottom: 100px;
			width: 500px;
			max-height: 98%;

			background-color: #a5a1ff;
			padding-top: 20px;

			transform: translateX(-550px); /* fully hidden */
			transition: transform 0.4s ease;

			border-radius: 15px 0px 0px 15px;
			box-shadow: 0 0 15px rgba(0,0,0,0.5);

			}

			.sidenavcontent {
			position: absolute;
			top: 0;
			bottom: 0;
			left: 0;
			right: 0;

			overflow-y: auto;
			overflow-x: hidden;

			padding-top: 20px;
			direction: rtl;
			padding-left: 10px;
			}

			.sidenavcontent::-webkit-scrollbar {
			width: 8px;
			}

			.sidenavcontent::-webkit-scrollbar-thumb {
			background: #e5e4ff;
			border-radius: 10px;
			}

			.sidenavcontent::-webkit-scrollbar-track {
			background: transparent;
			}

			.sidenavcontent a, p, li {
			direction: ltr; /* normal text again */
			}

			.sidenavcontent img {
			display: block;
			margin-right: auto; /* pushes it left */
			}

			/* Open state */
			.sidenav.open {
			transform: translateX(0);
			}

			/* Links */
			.sidenav a {
			display: block;
			}

			/* Tab button that sticks out */
			.sidenavtoggle {
			position: absolute;
			width: 60px;
			right: -60px;
			top: 0;
			bottom: 0;
			height: 100%;
			direction: ltr;
			display: flex;
			align-items: center;
			justify-content: center;

			background: #a5a1ff;
			color: #e5e4ff;
			padding: 0 10px;       /* horizontal padding only */

			cursor: pointer;

			border-radius: 0 10px 10px 0;
			}

			.arrow {
			display: inline-block;
			transition: transform 0.3s ease;
			font-size: 20px;
			}

			/* When sidebar is open, rotate arrow */
			.sidenav.open .arrow {
			transform: rotate(180deg);
			}

/* Marquee Container */
.marquee {
  display: block;
  overflow: hidden;
  white-space: nowrap;
  width: 200px;
}

#trackMarquee {
  transform: translateY(-10px);
}

/* Inner sliding track */
.marquee__track {
  display: inline-flex;
  white-space: nowrap;
  width: max-content;
  will-change: transform;
}

/* Inner content block */
.marquee__content {
  display: inline-block;
  flex-shrink: 0; /* Prevents text elements from squishing */
  padding-right: 40px; /* Space between the repeating texts */
}

/* Animation trigger */
.marquee.is-scrolling .marquee__track {
  animation-name: marquee-content;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}

@keyframes marquee-content {
  0% {
    transform: translateX(0);
  }
  100% {
    transform: translateX(-50%); /* Seamlessly slides by exactly 1 item width */
  }
}

  <script>
    /*hi change this script*/
const USERNAME = "Julesfr__";
const BASE_URL = `https://lastfm-last-played.biancarosa.com.br/${USERNAME}/latest-song`;

function escapeHtml(str) {
  return str
    ? str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;")
    : "";
}

async function getTrack() {
  try {
    const req = await fetch(BASE_URL);
    const json = await req.json();
    const track = json.track;
    const isPlaying = track["@attr"]?.nowplaying || false;
    const musicstate = isPlaying ? "Listening to" : "Last Listened to";

    const playing = document.getElementById("playing");
    playing.innerHTML = `
      <div id="lastfm">
        <img style="float: left; border-radius: 5px;" width="50%" src="${escapeHtml(track.image[3]["#text"])}"/>
        <div class="lastfm-row">
          <div id="lastfmtext" style="padding:15px">
            <p>${musicstate}</p>
            <br>
            <div class="marquee" id="trackMarquee">
              <div class="marquee__track">
                <span class="marquee__content">
                  <a href="${escapeHtml(track.url)}" style="font-size:20px">${escapeHtml(track.name)}</a>
                </span>
              </div>
            </div>
            <div class="marquee" id="artistMarquee" style="margin-top: 5px;">
              <div class="marquee__track">
                <span class="marquee__content" id="artistName">
                  ${escapeHtml(track.artist["#text"])}
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;

    // Wait for fonts to finish loading so measuring width is 100% accurate
    document.fonts.ready.then(() => {
      initMarquee("trackMarquee");
      initMarquee("artistMarquee");
    });

  } catch (e) {
    console.error(e);
  }
}

function initMarquee(containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;

  const track = container.querySelector(".marquee__track");
  const content = container.querySelector(".marquee__content");

  // Clean up previous cloned nodes if getTrack ran again
  const existingClones = track.querySelectorAll(".marquee__content");
  if (existingClones.length > 1) {
    for (let i = 1; i < existingClones.length; i++) {
      existingClones[i].remove();
    }
  }

  // Measure text width vs available box width
  if (content.offsetWidth > container.clientWidth) {
    // Clone original content for continuous loop
    const clone = content.cloneNode(true);
    track.appendChild(clone);

    // Speed in pixels per second (higher = faster)
    const pixelsPerSecond =200; 
    const singleWidth = content.offsetWidth;
    const duration = singleWidth / pixelsPerSecond;

    track.style.animationDuration = `${duration}s`;
    container.classList.add("is-scrolling");
  } else {
    container.classList.remove("is-scrolling");
  }
}

getTrack();
setInterval(getTrack, 5000);

  </script>
